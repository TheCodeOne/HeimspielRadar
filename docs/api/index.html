<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DBB REST API Reference | HeimspielRadar</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏀</text></svg>" />
    <meta
      name="description"
      content="Interactive OpenAPI 3.1 Documentation for the reverse-engineered German Basketball Federation (DBB) REST API."
    />
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #0f172a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      #fallback-banner {
        display: none;
        padding: 1rem;
        background: #1e293b;
        color: #f8fafc;
        text-align: center;
        border-bottom: 1px solid #334155;
      }
      #fallback-banner a {
        color: #38bdf8;
        font-weight: 600;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div id="fallback-banner">
      🏀 <strong>HeimspielRadar DBB API Docs</strong> &mdash; Viewing offline? Open using <code>npm run docs:dbb</code> or view raw <a href="./dbb-openapi.yaml" download>dbb-openapi.yaml</a>.
    </div>

    <!-- Scalar API Reference Standalone Container -->
    <script
      id="api-reference"
      data-url="./dbb-openapi.yaml"
      data-configuration='{
        "theme": "deepSpace",
        "layout": "modern",
        "showSidebar": true,
        "searchHotKey": "k",
        "metaData": {
          "title": "DBB REST API Reference | HeimspielRadar"
        }
      }'></script>

    <!-- Scalar API Reference CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference@1.25.114/dist/browser/standalone.min.js"></script>

    <script>
      // Display fallback banner if opened via file:// protocol
      if (window.location.protocol === 'file:') {
        document.getElementById('fallback-banner').style.display = 'block';
      }
    </script>
  </body>
</html>
