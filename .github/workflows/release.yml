name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry Run (preview release without committing or tagging)'
        type: boolean
        required: true
        default: false

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Run Nx Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Configure Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: npm ci

      - name: Run Nx Release (Dry Run)
        if: ${{ inputs.dry_run }}
        run: npm run release:dry-run

      - name: Run Nx Release
        if: ${{ !inputs.dry_run }}
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Git Changes & Tags
        if: ${{ !inputs.dry_run }}
        run: git push origin main --follow-tags
